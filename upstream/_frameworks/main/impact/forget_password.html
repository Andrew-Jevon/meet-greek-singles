{header}
<style>
    .fp_page { background: #f7f3ec; min-height: calc(100vh - 80px); padding: 64px 16px 80px; }
    .fp_wrap {
        max-width: 460px;
        margin: 0 auto;
        background: #ffffff;
        border: 1px solid #e8e1d2;
        border-radius: 18px;
        padding: 40px 36px 32px;
        box-shadow: 0 12px 36px rgba(28,40,64,0.06);
    }
    .fp_brand { text-align: center; margin-bottom: 22px; }
    .fp_brand h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: clamp(22px, 3.4vw, 26px);
        color: #1f2937;
        margin: 0 0 6px;
    }
    .fp_brand p { color: #5b6471; font-size: 14.5px; margin: 0; }

    .fp_msg {
        background: #faf6ec;
        border: 1px solid #e8e1d2;
        color: #1f2937;
        padding: 11px 14px;
        border-radius: 10px;
        font-size: 14px;
        margin-bottom: 16px;
    }
    .fp_msg.ok { background: #eaf3ec; border-color: #cae0ce; color: #1f4427; }
    .fp_msg.empty { display: none; }

    .fp_form label {
        display: block;
        margin: 0 0 6px;
        color: #1f2937;
        font-size: 13.5px;
        font-weight: 600;
    }
    .fp_form input[type="text"],
    .fp_form input[type="email"] {
        width: 100%;
        padding: 13px 14px;
        background: #ffffff;
        border: 1px solid #e1d8c2;
        border-radius: 10px;
        font-size: 15px;
        color: #1f2937;
        box-sizing: border-box;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .fp_form input:focus {
        outline: none;
        border-color: #2c4a76;
        box-shadow: 0 0 0 3px rgba(44,74,118,0.10);
    }
    .fp_btn {
        display: block;
        width: 100%;
        padding: 13px 0;
        margin-top: 16px;
        background: #2c4a76;
        color: #fff;
        font-family: 'Source Sans 3', system-ui, sans-serif;
        font-weight: 600;
        font-size: 15px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.1s ease;
    }
    .fp_btn:hover { background: #1f3a60; transform: translateY(-1px); }

    .fp_alt { text-align: center; margin-top: 18px; font-size: 13.5px; color: #5b6471; }
    .fp_alt a { color: #2c4a76; text-decoration: none; font-weight: 500; }
    .fp_alt a:hover { text-decoration: underline; }

    .header, .video-wrapper, .bg_shadow { display: none !important; }
    .main.above .wrapper { background: #f7f3ec !important; }
    .footer { background: transparent !important; }
    .footer_w .nav li, .footer_w .nav li a, .title_orig { color: #5b6471 !important; }

    @media (max-width: 480px) {
        .fp_page { padding: 36px 12px 60px; }
        .fp_wrap { padding: 30px 22px 26px; border-radius: 14px; }
    }
</style>

<div class="col_center fp_page">
    <div class="fp_wrap">

        <div class="fp_brand">
            <h1>Reset your password</h1>
            <p>Enter the email you signed up with and we&rsquo;ll send you a link to set a new password.</p>
        </div>

        <div class="fp_msg <!-- begin_no_msg -->empty<!-- end_no_msg -->">{message}</div>

        <form class="fp_form" action="{url_main}forget_password.php" method="POST" name="Forget">
            <label for="fp_mail">{l_your_email}</label>
            <input id="fp_mail" type="email" name="mail" maxlength="100" autocomplete="email" placeholder="{l_your_email}" />
            <button type="submit" class="fp_btn">{l_submit}</button>
        </form>

        <div class="fp_alt">
            <a href="{url_main}{url_page_login}">Back to sign in</a>
            &nbsp;&middot;&nbsp;
            <a href="{url_main}{url_page_join}">Create an account</a>
        </div>
    </div>
</div>
{footer}
